name: Release on merge to main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the parent commit to list what changed in this push.
          fetch-depth: 2

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          TITLE="$(git log -1 --pretty=%s)"
          BODY="$(git log -1 --pretty=%b | grep -iv '^Co-Authored-By:' || true)"
          FILES="$(git diff-tree --no-commit-id --name-status -r HEAD | sed -E \
            -e 's/^A\t(.*)/- Added `\1`/' \
            -e 's/^M\t(.*)/- Updated `\1`/' \
            -e 's/^D\t(.*)/- Removed `\1`/' \
            -e 's/^R[0-9]*\t(.*)\t(.*)/- Moved `\1` to `\2`/')"
          {
            printf '%s\n\n' "$TITLE"
            [ -n "$(echo "$BODY" | tr -d '[:space:]')" ] && printf '%s\n\n' "$BODY"
            printf '### Changes\n%s\n' "$FILES"
          } > notes.md
          gh release create "$TAG" --title "$TITLE" --notes-file notes.md
