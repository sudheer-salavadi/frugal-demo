name: Release on merge to main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          DESCRIPTION="$(git log -1 --pretty=%s)"
          gh release create "$TAG" \
            --title "$DESCRIPTION" \
            --notes "$DESCRIPTION"
